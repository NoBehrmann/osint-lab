spring.application.name=osint-lab

# Localhost only - never expose this to the network
server.address=127.0.0.1
server.port=8080

# Keep Tomcat work/upload files inside the project
server.tomcat.basedir=../.tmp/tomcat

spring.threads.virtual.enabled=true

# Uploads (photos, videos, documents). Tomcat streams them to a temp file on disk, never into memory;
# lazy parsing lets the API return a proper error for oversized files.
spring.servlet.multipart.max-file-size=1GB
spring.servlet.multipart.max-request-size=1025MB
spring.servlet.multipart.resolve-lazily=true
# Uploaded files are kept for the tools of one investigation, then deleted (see UploadStore)
osintlab.uploads.keep-minutes=30
osintlab.uploads.max-total-mb=3072

# Make browsers re-check the UI files on every load (cheap on localhost), so an updated app.js is
# picked up immediately instead of a stale cached copy.
spring.web.resources.cache.cachecontrol.no-cache=true

# External tools (paths relative to the osint-lab folder; run.cmd starts the app from there)
osintlab.venv=../.tools/venv
osintlab.temp-dir=../.tmp
osintlab.scripts=scripts
osintlab.phoneinfoga=../.tools/phoneinfoga/phoneinfoga.exe
osintlab.hf-cache=../.tools/hf-cache
osintlab.exiftool=../.tools/exiftool/exiftool.exe

# Contact address sent in the User-Agent to SEC EDGAR (required by its fair-access policy).
# Put your own address here if you use the Company Registries tool a lot.
osintlab.sec.contact=osint-lab@example.com

# Numbers entered without +country code are read as numbers of this region
osintlab.phone.default-region=DE

# Secrets (Instagram sessionid...) live in a separate file next to run.cmd
spring.config.import=optional:file:./secrets.properties
